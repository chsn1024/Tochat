<!DOCTYPE html>
<html lang="zh">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>面向计算机类大学生学习场景的智能问答助手</title>
    <style>
        :root {
            --bg: #f3efe7;
            --panel: rgba(255, 252, 247, 0.92);
            --panel-strong: #fffaf2;
            --text: #1d1a16;
            --muted: #6b6257;
            --accent: #bf5a2b;
            --accent-dark: #93411c;
            --line: rgba(54, 42, 28, 0.12);
            --user-bg: #f7d8c9;
            --bot-bg: #efe6d9;
            --meta-bg: #f7f1e7;
            --shadow: 0 18px 55px rgba(91, 64, 33, 0.12);
            --code-bg: #1d1f21;
            --code-text: #f5f5f5;
        }

        body.dark {
            --bg: #17191d;
            --panel: rgba(29, 31, 36, 0.94);
            --panel-strong: #23262c;
            --text: #f2eee7;
            --muted: #b5aa9b;
            --accent: #f08b57;
            --accent-dark: #cb6d3d;
            --line: rgba(255, 241, 224, 0.12);
            --user-bg: #553526;
            --bot-bg: #2a2e35;
            --meta-bg: #20242a;
            --shadow: 0 18px 55px rgba(0, 0, 0, 0.35);
            --code-bg: #0f1115;
            --code-text: #f5f5f5;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            font-family: "Noto Sans SC", "Microsoft YaHei", sans-serif;
            color: var(--text);
            background:
                radial-gradient(circle at top left, rgba(191, 90, 43, 0.18), transparent 28%),
                radial-gradient(circle at bottom right, rgba(49, 97, 140, 0.16), transparent 24%),
                linear-gradient(135deg, #efe2cf 0%, var(--bg) 52%, #e6ddd2 100%);
            transition: background 0.3s, color 0.3s;
        }

        body.dark {
            background:
                radial-gradient(circle at top left, rgba(240, 139, 87, 0.14), transparent 28%),
                radial-gradient(circle at bottom right, rgba(95, 132, 171, 0.16), transparent 24%),
                linear-gradient(135deg, #111318 0%, var(--bg) 52%, #12151a 100%);
        }

        .shell {
            max-width: 1180px;
            margin: 0 auto;
            padding: 24px;
            height: 100vh;
            display: grid;
            grid-template-columns: 320px 1fr;
            gap: 20px;
        }

        .sidebar,
        .main {
            background: var(--panel);
            border: 1px solid var(--line);
            border-radius: 24px;
            box-shadow: var(--shadow);
            backdrop-filter: blur(12px);
        }

        .sidebar {
            padding: 24px;
            position: sticky;
            top: 24px;
            align-self: start;
            height: calc(100vh - 48px);
            overflow-y: auto;
        }

        .brand {
            margin-bottom: 28px;
        }

        .eyebrow {
            display: inline-block;
            padding: 6px 10px;
            border-radius: 999px;
            background: rgba(191, 90, 43, 0.12);
            color: var(--accent-dark);
            font-size: 12px;
            font-weight: 700;
            letter-spacing: 0.06em;
        }

        .brand h1 {
            margin: 14px 0 10px;
            font-family: Georgia, "Times New Roman", serif;
            font-size: 30px;
            line-height: 1.15;
        }

        .brand p,
        .helper-text {
            margin: 0;
            color: var(--muted);
            line-height: 1.7;
        }

        .control-group {
            margin-top: 22px;
        }

        .user-panel {
            display: flex;
            align-items: center;
            gap: 12px;
            margin: 0 0 22px;
            padding: 14px 16px;
            border-radius: 16px;
            background: var(--panel-strong);
            border: 1px solid var(--line);
        }

        .panel-avatar {
            width: 48px;
            height: 48px;
            border-radius: 50%;
            object-fit: cover;
            border: 2px solid rgba(191, 90, 43, 0.25);
            background: var(--bg);
            flex: 0 0 auto;
        }

        .user-meta {
            min-width: 0;
        }

        .user-panel strong {
            display: block;
            margin-bottom: 4px;
        }

        .user-panel span {
            display: block;
            color: var(--muted);
            font-size: 13px;
            word-break: break-word;
        }

        .control-group label {
            display: block;
            margin-bottom: 8px;
            font-size: 14px;
            font-weight: 700;
        }

        select,
        input[type="text"] {
            width: 100%;
            border: 1px solid var(--line);
            border-radius: 14px;
            background: var(--panel-strong);
            color: var(--text);
            padding: 12px 14px;
            font-size: 15px;
        }

        .switch {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 14px 16px;
            border: 1px solid var(--line);
            border-radius: 16px;
            background: var(--panel-strong);
        }

        .switch input {
            width: 18px;
            height: 18px;
        }

        .button-row {
            display: flex;
            gap: 10px;
            margin-top: 22px;
        }

        .session-list {
            margin-top: 12px;
            display: flex;
            flex-direction: column;
            gap: 10px;
            max-height: 260px;
            overflow-y: auto;
        }

        .session-item {
            width: 100%;
            text-align: left;
            padding: 12px 14px;
            border-radius: 14px;
            border: 1px solid var(--line);
            background: var(--panel-strong);
            color: var(--text);
        }

        .session-item.active {
            border-color: var(--accent);
            box-shadow: inset 0 0 0 1px var(--accent);
        }

        .session-item small {
            display: block;
            margin-top: 6px;
            color: var(--muted);
            line-height: 1.5;
        }

        button {
            border: none;
            border-radius: 14px;
            padding: 12px 16px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 700;
            transition: transform 0.15s ease, opacity 0.15s ease, background 0.15s ease;
        }

        button:hover {
            transform: translateY(-1px);
        }

        .primary {
            background: var(--accent);
            color: #fff;
        }

        .secondary {
            background: transparent;
            color: var(--text);
            border: 1px solid var(--line);
        }

        .main {
            display: flex;
            flex-direction: column;
            overflow: hidden;
            height: calc(100vh - 48px);
            min-height: 0;
        }

        .main-header {
            padding: 22px 24px 16px;
            border-bottom: 1px solid var(--line);
        }

        .main-header h2 {
            margin: 0 0 6px;
            font-size: 22px;
        }

        .main-header p {
            margin: 0;
            color: var(--muted);
        }

        #chat {
            flex: 1;
            overflow-y: auto;
            min-height: 0;
            padding: 20px 24px;
        }

        .message-row {
            display: flex;
            align-items: flex-start;
            gap: 10px;
            margin-bottom: 16px;
            max-width: 88%;
        }

        .user-row {
            flex-direction: row-reverse;
            margin-left: auto;
        }

        .bot-row {
            margin-right: auto;
        }

        .avatar {
            width: 42px;
            height: 42px;
            border-radius: 50%;
            object-fit: cover;
            border: 2px solid rgba(191, 90, 43, 0.22);
            background: var(--panel-strong);
            box-shadow: 0 8px 22px rgba(91, 64, 33, 0.12);
            flex: 0 0 auto;
            user-select: none;
        }

        .bot-avatar {
            cursor: pointer;
        }

        .bot-avatar.shake {
            animation: avatarShake 0.35s ease;
        }

        .message {
            padding: 16px 18px;
            border-radius: 20px;
            line-height: 1.7;
            min-width: 0;
            animation: fadeUp 0.25s ease;
        }

        .user {
            background: var(--user-bg);
        }

        .bot {
            background: var(--bot-bg);
        }

        .structured-meta {
            margin-top: 12px;
            padding: 12px 14px;
            border-radius: 14px;
            background: var(--meta-bg);
            border: 1px solid var(--line);
            font-size: 13px;
            color: var(--muted);
        }

        .structured-meta details {
            margin-top: 10px;
        }

        .structured-meta summary {
            cursor: pointer;
            color: var(--text);
            font-weight: 700;
        }

        .structured-meta pre {
            margin: 10px 0 0;
            padding: 12px;
            border-radius: 12px;
            background: var(--panel-strong);
            border: 1px solid var(--line);
            overflow-x: auto;
            white-space: pre-wrap;
            word-break: break-word;
            color: var(--text);
        }

        .structured-meta strong {
            color: var(--text);
        }

        .scene-reminder {
            margin-top: 12px;
            padding: 12px 14px;
            border-radius: 14px;
            background: rgba(191, 90, 43, 0.08);
            border: 1px solid rgba(191, 90, 43, 0.2);
            color: var(--text);
            font-size: 13px;
            line-height: 1.7;
        }

        .source-badge {
            margin-top: 12px;
            display: inline-block;
            padding: 6px 10px;
            border-radius: 999px;
            background: rgba(49, 97, 140, 0.12);
            border: 1px solid rgba(49, 97, 140, 0.16);
            color: var(--text);
            font-size: 12px;
            font-weight: 700;
        }

        .status {
            padding: 0 24px 10px;
            color: var(--muted);
            font-size: 13px;
        }

        .mechanism-panel {
            margin: 16px 24px 0;
            padding: 14px 16px;
            border-radius: 16px;
            background: var(--panel-strong);
            border: 1px solid var(--line);
        }

        .mechanism-panel summary {
            cursor: pointer;
            font-size: 14px;
            font-weight: 700;
            color: var(--text);
            list-style: none;
        }

        .mechanism-panel summary::-webkit-details-marker {
            display: none;
        }

        .mechanism-panel[open] summary {
            margin-bottom: 10px;
        }

        .mechanism-grid {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 10px;
        }

        .mechanism-item {
            padding: 10px 12px;
            border-radius: 12px;
            background: var(--panel);
            border: 1px solid var(--line);
        }

        .mechanism-item strong {
            display: block;
            margin-bottom: 4px;
            font-size: 12px;
            color: var(--muted);
        }

        .mechanism-item span {
            font-size: 14px;
            color: var(--text);
        }

        .input-area {
            padding: 16px 24px 24px;
            border-top: 1px solid var(--line);
            display: flex;
            gap: 12px;
            align-items: flex-end;
        }

        #message {
            min-height: 52px;
            resize: vertical;
        }

        #send-button {
            min-width: 104px;
            min-height: 52px;
        }

        pre code {
            display: block;
            overflow-x: auto;
            padding: 1em;
            background: var(--code-bg);
            color: var(--code-text);
            border-radius: 12px;
        }

        code {
            font-family: Consolas, Monaco, monospace;
        }

        @keyframes fadeUp {
            from {
                opacity: 0;
                transform: translateY(6px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes avatarShake {
            0% {
                transform: translateX(0) rotate(0deg);
            }

            20% {
                transform: translateX(-3px) rotate(-6deg);
            }

            40% {
                transform: translateX(3px) rotate(6deg);
            }

            60% {
                transform: translateX(-2px) rotate(-4deg);
            }

            80% {
                transform: translateX(2px) rotate(4deg);
            }

            100% {
                transform: translateX(0) rotate(0deg);
            }
        }

        @media (max-width: 900px) {
            .shell {
                grid-template-columns: 1fr;
                height: auto;
                padding: 14px;
            }

            .sidebar,
            .main {
                height: auto;
            }

            .sidebar {
                position: static;
                overflow-y: visible;
            }

            .message {
                max-width: none;
            }

            .message-row {
                max-width: 100%;
            }

            .input-area {
                flex-direction: column;
            }

            #send-button {
                width: 100%;
            }
        }
    </style>

    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/highlight.js@11.7.0/styles/default.min.css">
    <script src="https://cdn.jsdelivr.net/npm/highlight.js@11.7.0/lib/highlight.min.js"></script>
</head>

<body>
    <div class="shell">
        <aside class="sidebar">
            <div class="brand">
                <span class="eyebrow">DeepSeek + Flask</span>
                <h1>学习场景智能问答助手</h1>
                <p>面向计算机类大学生，支持角色场景切换、多轮上下文管理与结构化输出。</p>
            </div>

            <div class="user-panel">
                <img class="panel-avatar" src="{{ current_user.avatar_url or default_ai_avatar }}" alt="用户头像">
                <div class="user-meta">
                    <strong>{{ current_user.nickname }}</strong>
                    <span>{{ current_user.email }}</span>
                </div>
            </div>

            <div class="control-group">
                <label for="scene">学习场景</label>
                <select id="scene">
                    {% for scene_key, scene_label in scenes.items() %}
                    <option value="{{ scene_key }}">{{ scene_label }}</option>
                    {% endfor %}
                </select>
            </div>

            <div class="control-group">
                <label>输出模式</label>
                <div class="switch">
                    <span>结构化回复模式</span>
                    <input type="checkbox" id="structured-mode" checked>
                </div>
            </div>

            <div class="control-group">
                <label>知识库</label>
                <div class="switch">
                    <span>知识库增强回答</span>
                    <input type="checkbox" id="rag-mode">
                </div>
            </div>

            <div class="control-group">
                <label>机制说明</label>
                <p class="helper-text">系统会保留最近多轮消息，并在历史过长时自动压缩成摘要，避免上下文无限膨胀。</p>
            </div>

            <div class="button-row">
                <button class="primary" type="button" onclick="toggleTheme()">暗 / 亮</button>
                <button class="secondary" type="button" onclick="resetChat()">重置会话</button>
                <button class="secondary" type="button" onclick="openProfile()">个人资料</button>
                <button class="secondary" type="button" onclick="logout()">退出</button>
            </div>

            <div class="control-group">
                <label>历史会话</label>
                <div class="session-list" id="session-list">
                    <p class="helper-text">正在加载历史记录...</p>
                </div>
            </div>
        </aside>

        <main class="main">
            <div class="main-header">
                <h2>当前对话</h2>
                <p>建议直接输入课程问题、代码报错、算法题思路或项目设计任务。</p>
            </div>

            <details class="mechanism-panel" id="mechanism-panel">
                <summary>机制状态展示</summary>
                <div class="mechanism-grid">
                    <div class="mechanism-item">
                        <strong>回答来源</strong>
                        <span id="mechanism-source">等待触发</span>
                    </div>
                    <div class="mechanism-item">
                        <strong>结构化输出</strong>
                        <span id="mechanism-structured">已开启</span>
                    </div>
                    <div class="mechanism-item">
                        <strong>上下文摘要</strong>
                        <span id="mechanism-summary">未启用</span>
                    </div>
                    <div class="mechanism-item">
                        <strong>场景一致性提醒</strong>
                        <span id="mechanism-scene">未触发</span>
                    </div>
                </div>
            </details>

            <div id="chat"></div>
            <div class="status" id="status">等待提问</div>

            <div class="input-area">
                <input type="text" id="message" placeholder="例如：用通俗语言解释一下进程和线程的区别，并给一个 Java 示例" onkeydown="handleKey(event)" />
                <button class="primary" id="send-button" type="button" onclick="sendMessage()">发送</button>
            </div>
        </main>
    </div>

    <script>
        const chatBox = document.getElementById("chat");
        const input = document.getElementById("message");
        const sceneSelect = document.getElementById("scene");
        const structuredModeToggle = document.getElementById("structured-mode");
        const ragModeToggle = document.getElementById("rag-mode");
        const statusText = document.getElementById("status");
        const sendButton = document.getElementById("send-button");
        const sessionList = document.getElementById("session-list");
        const mechanismSource = document.getElementById("mechanism-source");
        const mechanismStructured = document.getElementById("mechanism-structured");
        const mechanismSummary = document.getElementById("mechanism-summary");
        const mechanismScene = document.getElementById("mechanism-scene");
        const userAvatarUrl = {{ (current_user.avatar_url or default_ai_avatar) | tojson }};
        const aiAvatarOptions = {{ ai_avatar_options | tojson }};
        let aiAvatarIndex = Number(localStorage.getItem("aiAvatarIndex") || "0");
        if (!Number.isInteger(aiAvatarIndex) || aiAvatarIndex < 0 || aiAvatarIndex >= aiAvatarOptions.length) {
            aiAvatarIndex = 0;
        }
        let currentAiAvatarUrl = aiAvatarOptions[aiAvatarIndex];
        const placeholderByScene = {
            general: "例如：用通俗语言解释一下进程和线程的区别，并给一个 Java 示例",
            exam: "例如：408 考试里如何区分进程、线程和协程？请按考点帮我整理",
            coding: "例如：我的 Java 代码出现空指针异常，帮我分析可能原因和排查步骤",
            project: "例如：帮我设计一个学生管理系统，说明功能模块、技术选型和实施步骤"
        };
        let currentSessionId = null;

        function escapeHtml(value) {
            return value.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
        }

        function updateAllAiAvatars() {
            document.querySelectorAll(".bot-avatar").forEach((avatar) => {
                avatar.src = currentAiAvatarUrl;
            });
        }

        function cycleAiAvatar(avatar) {
            avatar.classList.remove("shake");
            void avatar.offsetWidth;
            avatar.classList.add("shake");

            window.setTimeout(() => {
                aiAvatarIndex = (aiAvatarIndex + 1) % aiAvatarOptions.length;
                currentAiAvatarUrl = aiAvatarOptions[aiAvatarIndex];
                localStorage.setItem("aiAvatarIndex", String(aiAvatarIndex));
                updateAllAiAvatars();
            }, 180);
        }

        function updateMechanismPanel({
            source = "",
            structuredMode = structuredModeToggle.checked,
            hasSummary = false,
            sceneReminder = ""
        } = {}) {
            mechanismSource.innerText = source === "local_faq"
                ? "本地 FAQ / 规则命中"
                : source === "deepseek"
                    ? "DeepSeek API"
                    : source === "knowledge_base"
                        ? "本地知识库 + DeepSeek"
                        : "等待触发";
            mechanismStructured.innerText = structuredMode ? "已开启" : "未开启";
            mechanismSummary.innerText = hasSummary ? "已启用" : "未启用";
            mechanismScene.innerText = sceneReminder ? "已触发" : "未触发";
        }

        function appendMessage(role, html, metadata = null, sceneReminder = "", source = "") {
            const row = document.createElement("div");
            row.className = `message-row ${role}-row`;

            const avatar = document.createElement("img");
            avatar.className = `avatar ${role}-avatar`;
            avatar.alt = role === "bot" ? "AI 助手头像" : "用户头像";
            avatar.src = role === "bot" ? currentAiAvatarUrl : userAvatarUrl;
            if (role === "bot") {
                avatar.title = "双击切换 AI 助手头像";
                avatar.ondblclick = () => cycleAiAvatar(avatar);
            }

            const message = document.createElement("div");
            message.className = `message ${role}`;
            message.innerHTML = html;

            if (metadata) {
                const meta = document.createElement("div");
                meta.className = "structured-meta";
                meta.innerHTML = `
                    <div><strong>摘要：</strong>${metadata.summary}</div>
                    <div><strong>类别：</strong>${metadata.category}</div>
                    <div><strong>置信度：</strong>${metadata.confidence}</div>
                    <details>
                        <summary>查看原始 JSON</summary>
                        <pre>${JSON.stringify(metadata, null, 2)}</pre>
                    </details>
                `;
                message.appendChild(meta);
            }

            if (sceneReminder) {
                const reminder = document.createElement("div");
                reminder.className = "scene-reminder";
                reminder.innerHTML = `<strong>场景提醒：</strong>${escapeHtml(sceneReminder)}`;
                message.appendChild(reminder);
            }

            if (source === "local_faq") {
                const badge = document.createElement("div");
                badge.className = "source-badge";
                badge.innerText = "本地 FAQ 命中";
                message.appendChild(badge);
            }

            row.appendChild(avatar);
            row.appendChild(message);
            chatBox.appendChild(row);
            if (window.hljs) {
                message.querySelectorAll("pre code").forEach((block) => window.hljs.highlightElement(block));
            }
            chatBox.scrollTop = chatBox.scrollHeight;
            return message;
        }

        function renderStreamingBotMessage(message, text) {
            message.innerHTML = marked.parse(text || "");
            if (window.hljs) {
                message.querySelectorAll("pre code").forEach((block) => window.hljs.highlightElement(block));
            }
            chatBox.scrollTop = chatBox.scrollHeight;
        }

        function appendBotExtras(message, metadata = null, sceneReminder = "", source = "", sources = []) {
            if (metadata) {
                const meta = document.createElement("div");
                meta.className = "structured-meta";
                meta.innerHTML = `
                    <div><strong>摘要：</strong>${metadata.summary}</div>
                    <div><strong>类别：</strong>${metadata.category}</div>
                    <div><strong>置信度：</strong>${metadata.confidence}</div>
                    <details>
                        <summary>查看原始 JSON</summary>
                        <pre>${JSON.stringify(metadata, null, 2)}</pre>
                    </details>
                `;
                message.appendChild(meta);
            }

            if (sceneReminder) {
                const reminder = document.createElement("div");
                reminder.className = "scene-reminder";
                reminder.innerHTML = `<strong>场景提醒：</strong>${escapeHtml(sceneReminder)}`;
                message.appendChild(reminder);
            }

            if (sources.length) {
                const sourceBox = document.createElement("div");
                sourceBox.className = "structured-meta";
                sourceBox.innerHTML = `
                    <div><strong>引用来源：</strong></div>
                    ${sources.map((item) => `<div>- ${escapeHtml(String(item.source))}，chunk_id：${escapeHtml(String(item.chunk_id))}</div>`).join("")}
                `;
                message.appendChild(sourceBox);
            }

            if (source === "local_faq" || source === "knowledge_base") {
                const badge = document.createElement("div");
                badge.className = "source-badge";
                badge.innerText = source === "local_faq" ? "本地 FAQ 命中" : "知识库增强";
                message.appendChild(badge);
            }

            chatBox.scrollTop = chatBox.scrollHeight;
        }

        function parseSseBlock(block) {
            const eventLine = block.split("\n").find((line) => line.startsWith("event:"));
            const dataLines = block
                .split("\n")
                .filter((line) => line.startsWith("data:"))
                .map((line) => line.slice(5).trimStart());

            return {
                event: eventLine ? eventLine.slice(6).trim() : "message",
                data: dataLines.length ? JSON.parse(dataLines.join("\n")) : {}
            };
        }

        async function sendMessage() {
            const userText = input.value.trim();
            if (!userText) return;

            appendMessage("user", escapeHtml(userText));
            const botMessage = appendMessage("bot", "<p>正在生成...</p>");
            input.value = "";
            sendButton.disabled = true;
            statusText.innerText = "正在流式生成...";

            try {
                const response = await fetch("/chat/stream", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({
                        message: userText,
                        scene: sceneSelect.value,
                        structured_mode: structuredModeToggle.checked,
                        rag_mode: ragModeToggle.checked
                    })
                });

                if (!response.ok) {
                    const data = await response.json();
                    throw new Error(data.error || "请求失败");
                }

                const reader = response.body.getReader();
                const decoder = new TextDecoder("utf-8");
                let buffer = "";
                let streamedText = "";

                while (true) {
                    const { value, done } = await reader.read();
                    if (done) break;

                    buffer += decoder.decode(value, { stream: true });
                    const blocks = buffer.split("\n\n");
                    buffer = blocks.pop();

                    for (const block of blocks) {
                        if (!block.trim()) continue;

                        const { event, data } = parseSseBlock(block);
                        if (event === "start") {
                            updateMechanismPanel({
                                source: data.source || "",
                                structuredMode: data.structured_mode,
                                hasSummary: data.has_summary,
                                sceneReminder: data.scene_reminder || ""
                            });
                        }

                        if (event === "delta") {
                            streamedText += data.content || "";
                            renderStreamingBotMessage(botMessage, streamedText);
                        }

                        if (event === "error") {
                            throw new Error(data.error || "流式请求失败");
                        }

                        if (event === "done") {
                            streamedText = data.reply || streamedText;
                            renderStreamingBotMessage(botMessage, streamedText);
                            appendBotExtras(
                                botMessage,
                                data.structured_mode ? data.structured : null,
                                data.scene_reminder || "",
                                data.source || "",
                                data.sources || []
                            );
                            updateMechanismPanel({
                                source: data.source || "",
                                structuredMode: data.structured_mode,
                                hasSummary: data.has_summary,
                                sceneReminder: data.scene_reminder || ""
                            });
                            statusText.innerText = `已完成 | 历史消息 ${data.history_count} 条 | 上下文摘要 ${data.has_summary ? "已启用" : "未启用"}`;
                            currentSessionId = data.session_id;
                            loadSessions();
                        }
                    }
                }
            } catch (error) {
                renderStreamingBotMessage(botMessage, `请求失败：${error.message}`);
                statusText.innerText = "请求失败";
            } finally {
                sendButton.disabled = false;
                input.focus();
            }
        }

        async function resetChat() {
            await fetch("/reset", { method: "POST" });
            chatBox.innerHTML = "";
            statusText.innerText = "会话已重置";
            updateMechanismPanel({
                source: "",
                structuredMode: structuredModeToggle.checked,
                hasSummary: false,
                sceneReminder: ""
            });
            loadSessions();
        }

        async function logout() {
            await fetch("/auth/logout", { method: "POST" });
            window.location.href = "/auth";
        }

        function openProfile() {
            window.location.href = "/profile";
        }

        function renderSessions(sessions) {
            if (!sessions.length) {
                sessionList.innerHTML = '<p class="helper-text">暂无历史会话</p>';
                return;
            }

            sessionList.innerHTML = "";
            sessions.forEach((item) => {
                const button = document.createElement("button");
                button.type = "button";
                button.className = `session-item ${item.session_id === currentSessionId ? "active" : ""}`;
                button.innerHTML = `
                    <strong>${item.message_count} 条消息</strong>
                    <small>${escapeHtml(item.summary_preview)}</small>
                    <small>${item.updated_at}</small>
                `;
                button.onclick = () => loadSession(item.session_id);
                sessionList.appendChild(button);
            });
        }

        async function loadSessions() {
            try {
                const response = await fetch("/sessions");
                const data = await response.json();
                currentSessionId = data.current_session_id;
                renderSessions(data.sessions || []);
            } catch (error) {
                sessionList.innerHTML = '<p class="helper-text">历史记录加载失败</p>';
            }
        }

        async function loadSession(sessionId) {
            try {
                const response = await fetch("/sessions/load", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ session_id: sessionId })
                });
                const data = await response.json();
                if (!response.ok) {
                    throw new Error(data.error || "加载失败");
                }

                chatBox.innerHTML = "";
                data.messages.forEach((item) => {
                    const html = item.role === "assistant" ? marked.parse(item.content) : escapeHtml(item.content);
                    appendMessage(item.role === "assistant" ? "bot" : "user", html);
                });
                currentSessionId = data.session_id;
                statusText.innerText = `已加载历史会话 | 历史消息 ${data.history_count} 条 | 上下文摘要 ${data.has_summary ? "已启用" : "未启用"}`;
                updateMechanismPanel({
                    source: "",
                    structuredMode: structuredModeToggle.checked,
                    hasSummary: data.has_summary,
                    sceneReminder: ""
                });
                loadSessions();
            } catch (error) {
                statusText.innerText = `加载历史会话失败：${error.message}`;
            }
        }

        function handleKey(event) {
            if (event.key === "Enter") {
                sendMessage();
            }
        }

        function toggleTheme() {
            document.body.classList.toggle("dark");
            localStorage.setItem("theme", document.body.classList.contains("dark") ? "dark" : "light");
        }

        function updatePlaceholder() {
            input.placeholder = placeholderByScene[sceneSelect.value] || placeholderByScene.general;
        }

        window.onload = () => {
            if (localStorage.getItem("theme") === "dark") {
                document.body.classList.add("dark");
            }
            updatePlaceholder();
            updateMechanismPanel({
                structuredMode: structuredModeToggle.checked
            });
            loadSessions();
        };

        sceneSelect.addEventListener("change", updatePlaceholder);
        structuredModeToggle.addEventListener("change", () => {
            updateMechanismPanel({
                source: mechanismSource.innerText === "本地 FAQ / 规则命中" ? "local_faq" : mechanismSource.innerText === "DeepSeek API" ? "deepseek" : mechanismSource.innerText === "本地知识库 + DeepSeek" ? "knowledge_base" : "",
                structuredMode: structuredModeToggle.checked,
                hasSummary: mechanismSummary.innerText === "已启用",
                sceneReminder: mechanismScene.innerText === "已触发" ? "triggered" : ""
            });
        });
    </script>
</body>
